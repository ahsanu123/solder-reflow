[package]
edition      = "2024"
name         = "tmd"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "esp32s3"
path = "./src/bin/main.rs"

[features]
default = []

ble = [
  "dep:bt-hci", 
  "dep:trouble-host",
  "dep:esp-radio"
]

[dependencies]
embassy-executor = "0.9.1"
embassy-sync = "0.7.2"
embassy-time = "0.5.0"
embedded-hal-async = "1.0.0"
embassy-embedded-hal = "0.5.0"
esp-hal = { version = "~1.0", features = ["defmt", "esp32s3", "unstable"] }
defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32s3"] }
critical-section = "1.2.0"
esp-alloc = { version = "0.9.0", features = ["defmt"] }
esp-backtrace = { version = "0.18.1", features = [
  "defmt",
  "esp32s3",
  "panic-handler",
] }
esp-rtos = { version = "0.2.0", features = ["embassy", "defmt", "esp32s3", "esp-radio"] }
esp-println = { version = "0.16.1", features = ["defmt-espflash", "esp32s3"] }
static_cell = "2.1.1"
heapless = { version = "0.9.2", features = ["defmt"] }
mipidsi = "0.9.0"

bt-hci = { version = "0.7.0", optional = true }
trouble-host = { version = "0.5.1", optional = true, features = ["derive", "defmt"]}
esp-radio = { version = "0.17.0", optional = true, features = ["ble", "defmt", "unstable", "esp32s3"] }
embassy-futures = "0.1.2"
embedded-hal = "1.0.0"
embedded-hal-bus = "0.3.0"
slint = { version = "1.15.1",default-features = false, features = [
  "renderer-software",
  "libm",
  "unsafe-single-threaded",
  "compat-1-2"
]}
embedded-graphics-core = {version = "0.4.1", features = ["defmt"]}

# i-slint-core = "1.15.1"
# i-slint-core-macros = "1.15.1"
# i-slint-renderer-software = "1.15.1"

# frr_shared = { path = "../shared" }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
